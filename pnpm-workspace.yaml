packages:
  - 'apps/*'

# One version of each shared dependency for every package.
catalog:
  # Machine payments (MPP), used by the merchant and by the gateway's client.
  #   @arbitrum/mpp 0.1.0 requires mppx ^0.6.7; 0.6.31 is the newest release in that line.
  #   mppx 0.6.31 needs viem 2.51.0 or later. viem 2.57.16 and later expect mppx 0.17 or later,
  #   so viem stays at 2.57.15 until @arbitrum/mpp supports a current mppx.
  '@arbitrum/mpp': 0.1.0
  mppx: 0.6.31
  viem: 2.57.15

  # Services
  express: 5.3.0
  zod: 4.6.7

  # The demo agent's model access (Claude API).
  '@anthropic-ai/sdk': 1.8.0

  # Tooling. TypeScript 6 is the version @arbitrum/mpp and typescript-eslint are built against.
  typescript: 6.0.3
  tsx: 4.23.15
  vitest: 5.1.0
  eslint: 10.14.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.72.2
  '@types/express': 5.0.6
  '@types/node': 22.20.5

# Every package in the dependency tree uses the same viem.
overrides:
  viem: 'catalog:'

# No dependency runs an install script. esbuild (used by tsx and vitest) works without its script.
allowBuilds:
  esbuild: false

# Advisories that `pnpm audit` passes over, each with the reason. CI runs `pnpm audit --prod`, and any
# advisory that is not listed here fails the build. Take an id out when its pin moves past the fix.
auditConfig:
  ignoreGhsas:
    # mppx below 0.8.2, "Gas Draining with access list". It is in mppx's Tempo method, where a server
    # co-signs a client's transaction as its fee payer. Nothing here registers that method: the gateway
    # and the merchant use only the `charge` method of @arbitrum/mpp, and the merchant builds its
    # settlement transaction itself. The fix needs mppx 0.8, which @arbitrum/mpp 0.1.0 cannot use.
    - GHSA-vc9j-9wph-qghj
    # mppx below 0.8.1, "Gas Draining with padding". The same fee-payer path of the Tempo method, and
    # the same reason.
    - GHSA-727h-3vm5-qwq6
