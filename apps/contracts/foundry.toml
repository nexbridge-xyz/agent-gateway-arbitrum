[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 128
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 120
sort_imports = true

[lint]
# block-timestamp: expiry, approval deadlines and UTC day buckets are time-based by design. The vault only
#   needs the block time to be right to well within a day, which the Arbitrum sequencer provides.
# require-revert-in-loop: createMandate checks the principal's own payee list and rejects the whole list
#   if one entry is bad.
exclude_lints = ["block-timestamp", "require-revert-in-loop"]

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
