# Secret scanning rules: gitleaks defaults, plus the public addresses that look like keys to it.
title = "agent-gateway-arbitrum"

[extend]
useDefault = true

[[allowlists]]
description = "A `token` field that holds a 20-byte address is a token contract, such as USDC. Keys are 32 bytes."
regexTarget = "match"
regexes = ['''(?i)token['"]?\s*[:=]\s*['"]0x[0-9a-f]{40}['"]''']
