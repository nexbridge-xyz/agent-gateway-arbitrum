name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      - name: Show Forge version
        run: forge --version

      - name: Format
        run: forge fmt --check

      - name: Build and lint
        run: forge build --sizes --deny warnings

      - name: Test
        run: forge test -vvv

      - name: Coverage
        run: forge coverage --no-match-coverage '(test|script)/'

      - name: ABI is up to date
        run: node scripts/export-abi.mjs --check

      # The deployed vault against this source, and the vault against the real USDC and registry. These
      # need a public RPC endpoint without an SLA. If the endpoint does not answer, the step is skipped
      # with a warning. If it answers, a failing test fails the build: this is the only place where CI
      # checks that the deployed code is what this repository builds. One retry, for a throttled endpoint.
      - name: Fork tests (Arbitrum Sepolia)
        env:
          ARBITRUM_SEPOLIA_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
        run: |
          if ! cast chain-id --rpc-url "$ARBITRUM_SEPOLIA_RPC_URL" >/dev/null 2>&1; then
            echo "::warning::The public Arbitrum Sepolia endpoint did not answer. The fork tests were skipped."
            exit 0
          fi
          forge test --match-path 'test/fork/*' -vv || { sleep 30; forge test --match-path 'test/fork/*' -vv; }

  typescript:
    name: Gateway, merchant, agent, console and scripts (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec prettier --check .

      # In two runs, the console apart, and with a stated heap. Linting with type information builds
      # a TypeScript program for each package: all of them in one process, on Node's default heap for
      # this runner, ran out of memory.
      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm run lint:eslint

      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm --filter @agent-gateway/gateway --filter @agent-gateway/merchant --filter @agent-gateway/agent --filter @agent-gateway/console run lint

      # No keys and no network. The Claude agent is tested against a stand-in for the API, and the
      # console against the gateway's own code with a stand-in for the wallet.
      - name: Test
        run: pnpm --filter @agent-gateway/gateway --filter @agent-gateway/merchant --filter @agent-gateway/agent --filter @agent-gateway/console run test

      - name: Build the console
        run: pnpm --filter @agent-gateway/console run build

      # No keys and no network: every recorded evidence file must still agree with itself.
      - name: Recorded evidence verifies
        run: pnpm verify-evidence docs/sepolia-run/evidence/*.json --offline

      - name: Install Foundry (for the fork below)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      # A real purchase over MPP between the gateway's spend wallet and the demo merchant, on a local
      # fork. It needs a public RPC endpoint without an SLA. If the endpoint does not answer, the step is
      # skipped with a warning. If it answers, a failing test fails the build.
      - name: MPP purchase on an Arbitrum Sepolia fork
        run: |
          if ! cast chain-id --rpc-url https://sepolia-rollup.arbitrum.io/rpc >/dev/null 2>&1; then
            echo "::warning::The public Arbitrum Sepolia endpoint did not answer. The MPP purchase test was skipped."
            exit 0
          fi
          anvil --fork-url https://sepolia-rollup.arbitrum.io/rpc --port 8546 --silent &
          for attempt in $(seq 1 30); do
            cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break
            sleep 1
          done
          MPP_FORK_RPC_URL=http://127.0.0.1:8546 pnpm --filter @agent-gateway/gateway exec vitest run test/purchase.fork.test.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      # Every commit on every branch that was fetched, with the rules in .gitleaks.toml.
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner .'
