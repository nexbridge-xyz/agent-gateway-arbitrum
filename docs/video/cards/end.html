<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Gateway: end card</title>
    <link rel="stylesheet" href="cards.css" />
    <style>
      .card {
        grid-template-rows: 96px 1fr 190px 96px;
      }
      .top,
      .bottom {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .top > *,
      .bottom > * {
        display: flex;
        align-items: center;
      }
      .middle {
        display: flex;
        align-items: center;
        padding: 0 40px;
      }
      .line {
        font-size: 92px;
      }
      .links {
        grid-template-columns: 1.6fr 1fr 1fr;
      }
      .links b {
        display: block;
        margin-top: 14px;
        font-family: var(--mono);
        font-size: 27px;
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
      .address {
        font-family: var(--mono);
        font-size: 18px;
        letter-spacing: 0.04em;
        color: var(--text-3);
      }
      .links .cell {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main class="card sheet">
      <div class="sheet top">
        <div class="cell wordmark">Agent Gateway</div>
        <div class="cell label">NexBridge</div>
        <div class="cell label">Built in Tokyo</div>
      </div>

      <div class="middle">
        <h1 class="line">Agents get a mandate,<br /><em>never the keys.</em></h1>
      </div>

      <div class="sheet links">
        <div class="cell">
          <span class="label">The code</span>
          <b>github.com/nexbridge-xyz/<br />agent-gateway-arbitrum</b>
        </div>
        <div class="cell">
          <span class="label">The company</span>
          <b>nexbridge.xyz</b>
        </div>
        <div class="cell">
          <span class="label">On X</span>
          <b>@0xNexBridge</b>
        </div>
      </div>

      <div class="sheet bottom">
        <div class="cell label">Testnet demo. Not audited.</div>
        <div class="cell label">MandateVault on Arbitrum Sepolia</div>
        <div class="cell address">0x7293763f…Cb6c8CCf</div>
      </div>
    </main>
  </body>
</html>
